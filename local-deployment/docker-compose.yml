services:
  agentgo-postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AGENTGO_POSTGRES_DB:-agentgo}
      POSTGRES_USER: ${AGENTGO_POSTGRES_USER:-agentgo}
      POSTGRES_PASSWORD: ${AGENTGO_POSTGRES_PASSWORD:-agentgo-local}
    ports:
      - "${AGENTGO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - agentgo-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENTGO_POSTGRES_USER:-agentgo} -d ${AGENTGO_POSTGRES_DB:-agentgo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Rewrites Host to localhost:9000 for in-compose OIDC token/JWKS/userinfo calls.
  authentik-oidc:
    # Pin a tag already present locally when Docker Hub is flaky (nginx:alpine pull).
    image: nginx:1.27-alpine
    profiles: ["local"]
    volumes:
      - ./nginx-authentik-oidc.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      authentik-server:
        condition: service_healthy
    restart: unless-stopped

  agentgo-app:
    # Prefer host bootJar when in-container Gradle plugin downloads fail:
    #   ..\gradlew.bat :agentgo-app:bootJar
    #   copy ..\agentgo-app\build\libs\agentgo-app-*.jar .\agentgo-app.jar
    build:
      context: .
      dockerfile: Dockerfile.app.prebuilt
    image: agentgo-app:local
    profiles: ["local"]
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://agentgo-postgresql:5432/${AGENTGO_POSTGRES_DB:-agentgo}
      DATABASE_USERNAME: ${AGENTGO_POSTGRES_USER:-agentgo}
      DATABASE_PASSWORD: ${AGENTGO_POSTGRES_PASSWORD:-agentgo-local}
      # Browser authorize/end-session stay on published localhost:9000.
      # Server-side token calls go through authentik-oidc so ID token iss matches.
      AGENTGO_OIDC_AUTHORIZATION_URI: ${AGENTGO_OIDC_AUTHORIZATION_URI:-http://localhost:9000/application/o/authorize/}
      AGENTGO_AUTHENTIK_BROWSER_BASE_URL: ${AGENTGO_AUTHENTIK_BROWSER_BASE_URL:-http://localhost:9000}
      AGENTGO_OIDC_TOKEN_URI: http://authentik-oidc:9000/application/o/token/
      AGENTGO_OIDC_JWK_SET_URI: http://authentik-oidc:9000/application/o/agentgo/jwks/
      AGENTGO_OIDC_USER_INFO_URI: http://authentik-oidc:9000/application/o/userinfo/
      AGENTGO_AUTHENTIK_API_BASE_URL: http://authentik-oidc:9000
      AGENTGO_OIDC_CLIENT_ID: ${AGENTGO_OIDC_CLIENT_ID:-agentgo}
      AGENTGO_OIDC_CLIENT_SECRET: ${AGENTGO_OIDC_CLIENT_SECRET:-}
      AGENTGO_UI_BASE_URL: ${AGENTGO_UI_BASE_URL:-http://localhost:20080}
      AGENTGO_AUTHENTIK_API_TOKEN: ${AGENTGO_AUTHENTIK_API_TOKEN:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-password-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-agentgo-bucket}
      AGENTGO_FILE_MAX_SIZE: 100MB
      AGENTGO_FILE_MAX_REQUEST_SIZE: 110MB
      AGENTGO_FILE_MAX_SIZE_BYTES: "104857600"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      TRACING_SAMPLING_PROBABILITY: "0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces
    depends_on:
      agentgo-postgresql:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      authentik-oidc:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "${AGENTGO_APP_PORT:-20082}:8080"
    # Avoid package installs in the JRE image (apt mirrors may be unavailable).
    # Probe readiness from the host after `docker compose up`.
    restart: unless-stopped

  agentgo-ui:
    # Host-prebuild the UI into ./ui-dist before building this image:
    #   VITE_AGENTGO_BACKEND_URL=http://localhost:20082 pnpm --dir ../../AgentGo-UI build
    #   then copy app/dist -> local-deployment/ui-dist (see scripts/sync-ui-dist.ps1)
    # Profile "local" = full Docker UI+app. Omit the profile for dev infra-only
    # (host Vite :5173 + bootRun :8080 against shared Authentik/Postgres/MinIO).
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: agentgo-ui:local
    profiles: ["local"]
    depends_on:
      - agentgo-app
    ports:
      - "${AGENTGO_UI_PORT:-20080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
    volumes:
      - authentik-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-authentik} -d ${PG_DB:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT:-10}
      AUTHENTIK_EMAIL__FROM: "${AUTHENTIK_EMAIL__FROM:-AgentGo <agentgo@example.com>}"
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - ./branding:/media/public/branding:ro
      - ./blueprints:/blueprints/custom:ro
    ports:
      - "${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT:-10}
      AUTHENTIK_EMAIL__FROM: "${AUTHENTIK_EMAIL__FROM:-AgentGo <agentgo@example.com>}"
    volumes:
      - authentik-media:/media
      - authentik-custom-templates:/templates
      - ./branding:/media/public/branding:ro
      - ./blueprints:/blueprints/custom:ro
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-alpine/minio}:${MINIO_VERSION:-latest-release}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9001}:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  agentgo-postgresql-data:
  authentik-postgresql-data:
  authentik-media:
  authentik-custom-templates:
  minio-data:
