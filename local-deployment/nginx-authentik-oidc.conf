# Internal-only reverse proxy so agentgo-app token/JWKS/userinfo calls hit
# Authentik with Host: localhost:9000. Browser traffic still uses the published
# authentik-server port. Matching Host keeps ID token iss aligned with
# RP-initiated logout validation.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;
  server {
    listen 9000;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host localhost:9000;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host localhost:9000;
      proxy_set_header X-Forwarded-Port 9000;
      proxy_set_header Connection "";
      proxy_pass http://authentik-server:9000;
    }
  }
}
