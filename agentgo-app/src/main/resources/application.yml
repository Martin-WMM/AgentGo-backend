spring:
  application:
    name: agentgo-backend
  security:
    oauth2:
      client:
        registration:
          authentik:
            provider: authentik
            client-id: ${AGENTGO_OIDC_CLIENT_ID:agentgo}
            client-secret: ${AGENTGO_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          authentik:
            authorization-uri: ${AGENTGO_OIDC_AUTHORIZATION_URI:http://localhost:9000/application/o/authorize/}
            token-uri: ${AGENTGO_OIDC_TOKEN_URI:http://host.docker.internal:9000/application/o/token/}
            jwk-set-uri: ${AGENTGO_OIDC_JWK_SET_URI:http://host.docker.internal:9000/application/o/agentgo/jwks/}
            user-info-uri: ${AGENTGO_OIDC_USER_INFO_URI:http://host.docker.internal:9000/application/o/userinfo/}
            user-name-attribute: preferred_username
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agentgo}
    username: ${DATABASE_USERNAME:agentgo}
    password: ${DATABASE_PASSWORD:agentgo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    description: AgentGo backend service

agentgo:
  starter:
    openapi:
      title: ${AGENTGO_OPENAPI_TITLE:AgentGo API}
      description: ${AGENTGO_OPENAPI_DESCRIPTION:AgentGo backend service API}
      version: ${AGENTGO_OPENAPI_VERSION:v1}
      terms-of-service-url: ${AGENTGO_OPENAPI_TERMS_URL:}
      contact-name: ${AGENTGO_OPENAPI_CONTACT_NAME:AgentGo Team}
      contact-url: ${AGENTGO_OPENAPI_CONTACT_URL:https://github.com/Martin-WMM/AgentGo-backend}
      contact-email: ${AGENTGO_OPENAPI_CONTACT_EMAIL:}
      license-name: ${AGENTGO_OPENAPI_LICENSE_NAME:Apache License 2.0}
      license-url: ${AGENTGO_OPENAPI_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0}
      server-url: ${AGENTGO_OPENAPI_SERVER_URL:}
      server-description: ${AGENTGO_OPENAPI_SERVER_DESCRIPTION:}
  auth:
    ui-base-url: ${AGENTGO_UI_BASE_URL:http://localhost:5173}
    authentik-api-base-url: ${AGENTGO_AUTHENTIK_API_BASE_URL:http://localhost:9000}
    authentik-api-token: ${AGENTGO_AUTHENTIK_API_TOKEN:}
    authentik-browser-base-url: ${AGENTGO_AUTHENTIK_BROWSER_BASE_URL:http://localhost:9000}
    authentik-application-slug: ${AGENTGO_AUTHENTIK_APPLICATION_SLUG:agentgo}
  file:
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9001}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:local-minio-password-change-me}
    bucket-name: ${MINIO_BUCKET:agentgo-bucket}
