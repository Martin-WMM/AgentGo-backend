services:
  agentgo-authentik-postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
    volumes:
      - agentgo-authentik-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AUTHENTIK_POSTGRES_USER:-authentik} -d $${AUTHENTIK_POSTGRES_DB:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  agentgo-authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    command: server
    container_name: agentgo-authentik-server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: agentgo-authentik-postgresql
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - agentgo-authentik-media:/media
      - agentgo-authentik-templates:/templates
    ports:
      - '20083:9000'
      - '20943:9443'
    depends_on:
      agentgo-authentik-postgresql:
        condition: service_healthy
    restart: unless-stopped

  agentgo-authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.3}
    command: worker
    container_name: agentgo-authentik-worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: agentgo-authentik-postgresql
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?AUTHENTIK_POSTGRES_PASSWORD is required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - agentgo-authentik-media:/media
      - agentgo-authentik-templates:/templates
    depends_on:
      agentgo-authentik-postgresql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentgo-authentik-postgresql-data:
  agentgo-authentik-media:
  agentgo-authentik-templates:
