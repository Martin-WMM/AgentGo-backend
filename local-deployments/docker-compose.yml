services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentgo}
      POSTGRES_USER: ${POSTGRES_USER:-agentgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgo-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgo} -d ${POSTGRES_DB:-agentgo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  agentgo-app:
    build:
      context: ..
      dockerfile: local-deployments/Dockerfile.app
    image: agentgo-app:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentgo}
      DATABASE_USERNAME: ${POSTGRES_USER:-agentgo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-agentgo-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-development-key}
      AGENTGO_OIDC_AUTHORIZATION_URI: ${AGENTGO_OIDC_AUTHORIZATION_URI:-http://localhost:9000/application/o/authorize/}
      AGENTGO_OIDC_TOKEN_URI: ${AGENTGO_OIDC_TOKEN_URI:-http://host.docker.internal:9000/application/o/token/}
      AGENTGO_OIDC_JWK_SET_URI: ${AGENTGO_OIDC_JWK_SET_URI:-http://host.docker.internal:9000/application/o/agentgo/jwks/}
      AGENTGO_OIDC_USER_INFO_URI: ${AGENTGO_OIDC_USER_INFO_URI:-http://host.docker.internal:9000/application/o/userinfo/}
      AGENTGO_OIDC_CLIENT_ID: ${AGENTGO_OIDC_CLIENT_ID:-agentgo}
      AGENTGO_OIDC_CLIENT_SECRET: ${AGENTGO_OIDC_CLIENT_SECRET:?AGENTGO_OIDC_CLIENT_SECRET must be set in local-deployments/.env}
      AGENTGO_UI_BASE_URL: ${AGENTGO_UI_BASE_URL:-http://localhost:5173}
      AGENTGO_OPENAPI_TITLE: ${AGENTGO_OPENAPI_TITLE:-AgentGo API}
      AGENTGO_OPENAPI_DESCRIPTION: ${AGENTGO_OPENAPI_DESCRIPTION:-AgentGo backend service API}
      AGENTGO_OPENAPI_VERSION: ${AGENTGO_OPENAPI_VERSION:-v1}
      AGENTGO_OPENAPI_TERMS_URL: ${AGENTGO_OPENAPI_TERMS_URL:-}
      AGENTGO_OPENAPI_CONTACT_NAME: ${AGENTGO_OPENAPI_CONTACT_NAME:-AgentGo Team}
      AGENTGO_OPENAPI_CONTACT_URL: ${AGENTGO_OPENAPI_CONTACT_URL:-https://github.com/Martin-WMM/AgentGo-backend}
      AGENTGO_OPENAPI_CONTACT_EMAIL: ${AGENTGO_OPENAPI_CONTACT_EMAIL:-}
      AGENTGO_OPENAPI_LICENSE_NAME: ${AGENTGO_OPENAPI_LICENSE_NAME:-Apache License 2.0}
      AGENTGO_OPENAPI_LICENSE_URL: ${AGENTGO_OPENAPI_LICENSE_URL:-https://www.apache.org/licenses/LICENSE-2.0}
      AGENTGO_OPENAPI_SERVER_URL: ${AGENTGO_OPENAPI_SERVER_URL:-}
      AGENTGO_OPENAPI_SERVER_DESCRIPTION: ${AGENTGO_OPENAPI_SERVER_DESCRIPTION:-}
      AGENTGO_AUTHENTIK_API_BASE_URL: ${AGENTGO_AUTHENTIK_API_BASE_URL:-http://host.docker.internal:9000}
      AGENTGO_AUTHENTIK_API_TOKEN: ${AGENTGO_AUTHENTIK_API_TOKEN:-}
      AGENTGO_AUTHENTIK_BROWSER_BASE_URL: ${AGENTGO_AUTHENTIK_BROWSER_BASE_URL:-http://localhost:9000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9001}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-password-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-agentgo-bucket}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      TRACING_SAMPLING_PROBABILITY: "0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENTGO_APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
