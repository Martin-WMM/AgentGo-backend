name: Review Policy

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  review-policy:
    name: review-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce author review policy
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user.login.toLowerCase();
            const repositoryOwner = context.repo.owner.toLowerCase();

            if (pullRequest.draft) {
              core.notice('Draft pull requests do not require approval yet.');
              return;
            }

            if (author === repositoryOwner) {
              core.notice(`Pull request author ${pullRequest.user.login} is the repository owner; approval is not required.`);
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              },
            );

            const latestReviewByUser = new Map();
            for (const review of reviews) {
              if (!review.user?.login) continue;
              const reviewer = review.user.login.toLowerCase();
              const previous = latestReviewByUser.get(reviewer);
              const currentTimestamp = new Date(review.submitted_at ?? 0).getTime();
              const previousTimestamp = previous
                ? new Date(previous.submitted_at ?? 0).getTime()
                : -1;
              if (!previous || currentTimestamp >= previousTimestamp) {
                latestReviewByUser.set(reviewer, review);
              }
            }

            const hasIndependentApproval = [...latestReviewByUser.entries()].some(
              ([reviewer, review]) => reviewer !== author && review.state === 'APPROVED',
            );

            if (!hasIndependentApproval) {
              core.setFailed('This pull request requires an approval from a reviewer other than the author.');
            }
