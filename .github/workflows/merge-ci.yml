name: Merge CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.14'
      - name: Test and enforce coverage
        run: gradle test koverVerify --stacktrace
      - name: Build Jar
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: agentgo-jars
          path: '**/build/libs/*.jar'

